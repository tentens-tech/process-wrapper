# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "50...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

# Test helpers are not runtime code
ignore:
  - "test/**/*"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
