version: "2"
run:
  concurrency: 4
  tests: false
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - ^pkg/stat/tcp_connections.go
      - ^pkg/stat/transport.go
      - ^cmd/
      - ^examples/
      - ^deployment/
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
