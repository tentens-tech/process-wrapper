# amqp probe: opens an AMQP connection using credentials from the process envs.
# The password is never logged (shown as xxx in the probe name).
#
#   docker run -d --name rabbitmq -p 5672:5672 rabbitmq:4-management
#   go run . -config examples/amqp.yaml
- name: "app"
  entrypoint: "sleep"
  args: ["3600"]
  envs:
    AMQP_PROBE_RABBITMQ_DSN_TEMPLATE: "amqp://%v:%v@localhost:5672/"   # %v = user, password
    AMQP_PROBE_RABBITMQ_USER: "guest"
    AMQP_PROBE_RABBITMQ_PASS: "guest"
  readiness:
    delay: "2s"
    period: "3s"
    failureThreshold: 3
    amqp:
      reuseConn: false          # true: keep the connection open and only check it is alive
