# /prommerge scrapes `promTarget` of every READY process and returns all
# metrics in one response with an extra label process_name="<name>".
# Here both processes point to process-wrapper's own /metrics for simplicity.
#
#   go run . -config examples/prommerge.yaml
#   curl -s localhost:8111/prommerge | grep 'process_name="app-1"' | head
- name: "app-1"
  entrypoint: "sleep"
  args: ["3600"]
  promTarget: "http://localhost:8111/metrics"
- name: "app-2"
  entrypoint: "sleep"
  args: ["3600"]
  promTarget: "http://localhost:8111/metrics"
  readiness:
    delay: "1s"
    period: "2s"
    tcp:
      socket: "localhost:8111"
