# restartBackoff: exponential delay between restarts of a crashing process.
# Defaults: initialDelay 1s, multiplier 2, maxDelay 1m, jitter 0.2,
# successThreshold 10s. The failure counter is reset when the process runs
# longer than successThreshold or its readiness probe passes.
# restartPolicy: never disables restarts.
#
#   go run . -config examples/restart-backoff.yaml
#   # Restart command in 500ms (failures=1), 1s, 2s, 4s, 8s, 10s, 10s ...
#   curl -s localhost:8111/metrics | grep sidecar_cmd_restart_backoff_seconds
- name: "crash-loop"
  restartBackoff:
    initialDelay: "500ms"
    maxDelay: "10s"
    multiplier: 2
    successThreshold: "5s"
    jitter: 0
  entrypoint: "sh"
  args: ["-c", "sleep 0.5; exit 1"]

- name: "one-shot"
  restartPolicy: "never"        # "always" (default) or "never"
  entrypoint: "sh"
  args: ["-c", "echo one-shot done"]
