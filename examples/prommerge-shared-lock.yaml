# Shared lock + prommerge: metrics are merged only while the process holds the
# lock and is ready. See shared-lock.yaml for how to start the lock server.
- name: "singleton"
  entrypoint: "sleep"
  args: ["3600"]
  promTarget: "http://localhost:8111/metrics"
  readiness:
    delay: "1s"
    period: "1s"
    failureThreshold: 3
    lock:
      ttlDuration: "3s"
