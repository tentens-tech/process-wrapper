# memoryLimitMB kills and restarts the process when its RSS exceeds the limit
# (1MB = 1,000,000 bytes). Process stats are collected every 10s and on Linux
# only, so run it in a container:
#
#   docker run --rm -v "$PWD":/app -w /app golang:1.26 \
#     sh -c 'apt-get update -qq && apt-get install -y -qq python3 >/dev/null && go run . -config examples/memory-limit.yaml'
- name: "oom"
  entrypoint: "python3"
  args:
    - "-c"
    - "import time; data = bytearray(300 * 1000 * 1000); time.sleep(3600)"   # ~300MB
  memoryLimitMB: 100
