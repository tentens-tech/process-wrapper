# wrapper runs as root, the process, its exec probe and hook as 65532
- name: "cred"
  entrypoint: "sh"
  args: ["-c", "id -u > /tmp/cred.proc; exec sleep 3600"]
  sysProcAttr:
    credential: {uid: 65532, gid: 65532}
  readiness:
    delay: "1s"
    period: "1s"
    exec:
      command: {entrypoint: "sh", args: ["-c", "id -u > /tmp/cred.probe"]}
  postStart:
    command: {entrypoint: "sh", args: ["-c", "id -u > /tmp/cred.hook"]}
